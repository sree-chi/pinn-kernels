[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-kernels"
version = "0.1.0"
description = "Physics-informed neural networks with LLVM- and Triton-generated residual kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "matplotlib"]

[project.optional-dependencies]
gpu = ["triton", "cupy-cuda12x"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["pinn_kernels*"]

[tool.setuptools.package-data]
pinn_kernels = ["_lib/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU"]
